name: Update official cyber feeds

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexvibe-live-data
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync official public sources
        run: node scripts/update-live-data.mjs
      - name: Commit refreshed public data
        run: |
          git config user.name "nexvibe-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/*.json
          git diff --cached --quiet || git commit -m "chore: refresh official cyber feeds"
          git push
